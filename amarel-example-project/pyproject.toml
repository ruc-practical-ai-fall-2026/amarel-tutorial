[project]
name = "amarel-example-project"
version = "0.1.0"
description = "PyTorch training example for Rutgers Amarel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "numpy>=2.5.4",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false

